dependencies = [
    "apscheduler>=3.11.3",
    "argon2-cffi>=25.1.0",
    "fastapi[standard]>=0.165.0",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
